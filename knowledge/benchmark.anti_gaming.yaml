        - "No explicit sybil deduplication mechanism"
        - "No innovation forcing function (rewards calibration, not novelty)"
        - "Winner-takes-all creates high variance"
        - "Forecasting domain is narrower than NAS"
      key_risk: "Limited innovation pressure — rewards playing it safe"

    gradients:
      overall: "B+"
      strengths:
        - "Code submission model with anti-obfuscation (no .bin/.pyc/.dll)"
        - "Tournament structure with progressive champion decay (-0.33%/day)"
        - "229+ repo evolutionary archive creates rising baseline"
        - "7 task types (Instruct, DPO, GRPO, Chat, SDXL, Flux, RL)"
        - "Boss round uses 6 tasks, majority rule prevents single-task gaming"
        - "Entry fees burned — economic cost for sybil attempts"
        - "RestrictedPython sandbox for RL reward functions"
        - "Docker --network none isolation (no internet during training)"
      weaknesses:
        - "CENTRALIZED VALIDATOR (Rayon Labs) — single point of trust"
        - "Secret test sets controlled by single entity"
        - "Stake-gated entry creates pay-to-play dynamic"
        - "No Pareto-style sybil resistance"
        - "Auditor verification is post-hoc only (7-day window)"
        - "Champion entrenchment possible despite decay mechanism"
        - "Expensive: all 32 miners get full H100 training runs"
      key_risk: "Centralized validator = centralized trust. Entire subnet depends on Rayon Labs' integrity."

# =============================================================================
# SPECIFIC GAMING ATTACK ANALYSIS
# =============================================================================

attack_analysis:
  sybil_multi_uid:
    attack: "Register N UIDs with same or similar submissions"
    radar: |
      DEFEATED: Pareto deduplication means identical submissions
      share the same frontier point. penalty_exponent 2.5 makes
      splitting strictly worse than consolidation.
    numinous: |
      MOSTLY DEFEATED: Winner-takes-all means copies split rank,
      not multiply rewards. But no formal dedup mechanism.
    gradients: |
      PARTIALLY DEFEATED: Stake-gated entry limits to 32 slots.
      But wealthy attackers can secure multiple slots with capital.

  weight_copying:
    attack: "Validator copies other validators' weight submissions"
    radar: |
      LOW RISK: Deterministic training means honest validators
      naturally agree. Copying is indistinguishable from honest
      independent computation. commit-reveal optional if needed.
    numinous: |
      LOW RISK: Deterministic execution + gateway gives natural
      validator agreement. Same analysis as RADAR.
    gradients: |
      MEDIUM RISK: Different validators may use different test sets.
      Weight agreement is less natural. commit-reveal more important.

  insider_collusion:
    attack: "Validator leaks evaluation data to own miners"
    radar: |
      DEFEATED: No evaluation data to leak. Ground truth is the
      training outcome itself. Validator would need to train the
      architecture AND leak it — but the miner already submitted it.
    numinous: |
      DEFEATED: Ground truth is external (event resolution from
      Polymarket/Azuro). Validators don't control outcomes.
    gradients: |
      STRUCTURALLY VULNERABLE: A SINGLE centralized validator (Rayon Labs)
      controls ALL secret test sets, ALL evaluation, and ALL weight submission.
      If this single entity runs own miners or shares test data, there is no
      real-time prevention mechanism. Auditor validators can only detect
      anomalies post-hoc within a 7-day window. This is the strongest form
      of the validator-leak attack: one entity, total information control.

  lazy_validator:
    attack: "Validator skips computation, submits random/copied weights"
    radar: |
      DETECTABLE: Deterministic training means honest validators
      will strongly agree. Random weights are outliers, clipped
      by Yuma Consensus. Lazy validators lose stake influence.
    numinous: |
      DETECTABLE: Same mechanism — deterministic execution means
      lazy validators produce outlier weights, clipped by consensus.
    gradients: |
      NOT APPLICABLE IN TRADITIONAL SENSE: Single centralized validator.
      The "lazy validator" attack becomes "lazy auditor" — auditors that
      don't bother to verify the main validator's work. This is actually
      expected behavior since auditing is optional and low-reward.

  model_copy_with_noise:
    attack: "Copy best submission, add trivial noise to appear different"
    radar: |
      DEFEATED: Assigned parent mechanism means copied architecture
      IS the parent. Score = improvement over parent = ~0.
      Noise doesn't help because improvement is measured, not similarity.
    numinous: |
      PARTIALLY DEFEATED: Noisy copy produces similar Brier Score.
      Winner-takes-all means tie goes to original (or random).
      No positive incentive to copy.
    gradients: |
      PARTIALLY DEFEATED: Champion margin means noisy copy must
      beat original by 5-10%. Mere copying with noise fails.
      But leaked test set could enable targeted improvement.

  compute_resource_gaming:
    attack: "Use external compute resources beyond what's allowed"
    radar: |
      PREVENTED: Validator runs training on own infrastructure.
      Miner code executes in validator-controlled container.
      No external compute can assist during evaluation.
    numinous: |
      PARTIALLY BOUNDED: Gateway proxy mediates all external calls.
      Default $0.01/run on Chutes. BUT linked accounts get $1.00/run
      on OpenAI — a 100x budget advantage creating pay-to-win dynamics.
      Network is fully isolated (no external internet except via proxy).
    gradients: |
      PREVENTED: Validator runs training code in isolated container.
      Same model as RADAR — validator infrastructure only.

  strategic_failure:
    attack: "Intentionally fail on difficult events to get a known default score"
    radar: |
      NOT APPLICABLE: Training loss is always measured. No mechanism
      for strategic failure — architecture either trains or doesn't.
    numinous: |
      EXPLOITABLE: Failed agents receive imputed 0.5 prediction (Brier=0.25).
      This is deterministic and known. On high-uncertainty events where
      most agents score worse than 0.25, strategic failure is rational.
    gradients: |
      PARTIALLY APPLICABLE: Tournament elimination means failure = elimination.
      No benefit from strategic failure since it guarantees loss.

  api_cost_asymmetry:
    attack: "Well-funded miners get better results via higher API budgets"
    radar: |
      NOT APPLICABLE: Training runs on validator infrastructure.
      No external API calls during evaluation. Equal compute for all.
    numinous: |
      VULNERABLE: Linked accounts get 100x budget on external APIs.
      $1.00/run on OpenAI vs $0.01/run default on Chutes.
      More API budget = more inference calls = better reasoning = higher scores.
      This creates a capital advantage independent of code quality.
    gradients: |
      NOT APPLICABLE: Training runs on validator infrastructure.
      No external API access during evaluation.

# =============================================================================
# WHAT RADAR SHOULD LEARN FROM PEERS
# =============================================================================

lessons_to_adopt:
  from_numinous:
    gateway_proxy_pattern:
      what: "Signing proxy for controlled external API access"
      why: |
        If RADAR architectures need external resources during training
        (unlikely for NAS but possible for data-dependent architectures),
        Numinous's gateway pattern is the gold standard for controlled access.
      priority: "LOW - only relevant if external API access needed"

    update_rate_limiting:
      what: "3-day minimum between code updates"
      why: |
        Prevents rapid trial-and-error probing of the scoring system.
        RADAR's per-epoch submission model may allow too-frequent updates
        in early network stages. Consider minimum intervals.
      priority: "MEDIUM - worth considering for early network stability"

    proper_scoring_rule:
      what: "Brier Score guarantees honest prediction is optimal"
      why: |
        RADAR should verify its scoring function has this property.
        If gaming the scoring function is easier than doing honest work,
        the mechanism fails regardless of other protections.
      priority: "HIGH - verify RADAR's scoring is a proper scoring rule"

    avoid_api_cost_asymmetry:
      what: "Numinous's linked accounts create 100x API budget gap ($0.01 vs $1.00)"
      why: |
        RADAR's validator-run training avoids this entirely — equal compute
        for all miners by design. This is a significant advantage over
        Numinous and should be preserved. Never introduce external API
        access during evaluation that could create budget-gated advantages.
      priority: "HIGH - preserve equal-compute-for-all as invariant"

    deterministic_failure_handling:
      what: "Numinous imputes 0.5 on failure (known, exploitable)"
      why: |
        If RADAR has failure modes (architecture doesn't compile, training
        diverges), the failure penalty should be WORSE than any honest
        attempt, not a known fixed value that could be strategically optimal.
        Consider: failure score = worst honest score * 1.5.
      priority: "MEDIUM - prevent strategic failure gaming"

  from_gradients:
    tournament_engagement:
      what: "Knockout bracket structure creates excitement"
      why: |
        Evolutionary NAS could adopt tournament-style epochs where
        architectures compete in brackets, adding engagement layer
        on top of the Pareto scoring. This is a UX improvement, not
        a security improvement.
      priority: "LOW - engagement, not anti-gaming"

    champion_margin_with_decay:
      what: "Progressive champion advantage: 10% initial → 3% floor, decays -0.33%/day"
      why: |
        RADAR could add minimum improvement thresholds for an
        architecture to displace its parent. This prevents trivial
        +epsilon improvements from dominating the frontier.
        The TIME DECAY is key: prevents indefinite stagnation.
        Consider: improvement threshold that decays with lineage age.
      priority: "MEDIUM - prevents epsilon attacks while avoiding entrenchment"

    open_source_archival:
      what: "229+ repos with naming convention god-[type]-tourn-[id]-[date]-position-[rank]"
      why: |
        RADAR's winning architectures should be archived and published
        with systematic naming (e.g., radar-vision-epoch-42-rank-1).
        Creates community learning + rising baseline. Already aligned
        with Chi's open_source_preference invariant. Gradients proves
        this model works at scale.
      priority: "HIGH - already fits Chi's design philosophy"

    anti_obfuscation_rules:
      what: "Binary files banned, license verified character-for-character"
      why: |
        RADAR should enforce similar code transparency: ban compiled
        artifacts in Docker images, require readable source code.
        This prevents hiding malicious or gaming logic in opaque binaries.
        Gradients' approach is lightweight and effective.
      priority: "HIGH - simple to implement, significant anti-gaming value"

    avoid_centralized_validator:
      what: "Gradients' single-validator model creates trust concentration"
      why: |
        RADAR MUST NOT replicate Gradients' centralized validator pattern.
        A single entity controlling evaluation, scheduling, and weight
        submission is a fundamental trust vulnerability. RADAR's distributed
        validator model with deterministic training is strictly superior.
        The auditor pattern is a weak mitigation — post-hoc, not preventive.
      priority: "CRITICAL - architectural invariant to preserve"

    restricted_execution_for_rl:
      what: "RestrictedPython wrapper blocks dangerous operations in GRPO reward functions"
      why: |
        If RADAR's agent meta-layer allows miners to submit executable
        reward/evaluation functions, use RestrictedPython or similar
        sandboxing to block file I/O, network access, system commands,
        and dangerous builtins (eval, exec, globals, locals).
      priority: "HIGH if agent meta-layer includes executable code"

# =============================================================================
# KNOWN GAPS AND OPEN QUESTIONS
# =============================================================================

open_questions:
  radar_specific:
    agent_meta_layer_gaming:
      question: |
        If miners submit "agents that design architectures," what prevents
        an agent from being optimized to game the scoring function rather
        than genuinely search for good architectures?
      proposed_mitigation: |
        The scoring function evaluates the ARCHITECTURES produced by the agent,
        not the agent itself. An agent that games scoring still needs to produce
        architectures that score well on the multi-axis Pareto frontier.
      risk_level: "MEDIUM"

    compute_cost_sustainability:
      question: |
        RADAR requires validators to TRAIN architectures. This is
        significantly more expensive than Numinous (inference only)
        or even Gradients (training but only 32 miners per week).
        How does this scale?
      proposed_mitigation: |
        4-stage funnel with ~80% elimination at Stage 1 helps.
        Also: architectures could be trained at smaller scale for
        evaluation, with scaling exponent predicting full-scale behavior.
      risk_level: "HIGH - compute cost is existential for validator participation"

    scaling_exponent_manipulation:
      question: |
        Could a miner design an architecture that artificially inflates
        its scaling exponent gamma by performing poorly at low FLOP counts
        and normally at high FLOP counts?
      proposed_mitigation: |
        Require minimum absolute performance at each checkpoint, not just
        slope. Add R-squared of the log-log fit as a quality filter.
        Reject architectures with poor fit (noisy/manipulated curves).
      risk_level: "MEDIUM - worth adding R-squared filtering"

  ecosystem_comparison:
    production_validation:
      question: "RADAR scores highest on paper but has zero mainnet hours. How confident are the theoretical advantages?"
      answer: |
        Every anti-gaming mechanism in RADAR has precedent:
        - Pareto scoring: proven on SN120 (Affine)
        - Container execution: proven on SN6, SN56, SN26, SN120
        - Code submission: proven on SN56 (Gradients)
        - Improvement-over-baseline: proven on SN3 (Templar gradient quality)
        The novelty is the COMBINATION, not individual components.
        Deploy on testnet with adversarial red-teaming before mainnet.

