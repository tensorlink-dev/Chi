# =============================================================================
# SPECIFIC GAMING ATTACK ANALYSIS
# =============================================================================

attack_analysis:
  sybil_multi_uid:
    attack: "Register N UIDs with same or similar submissions"
    radar: |
      DEFEATED: Pareto deduplication means identical submissions
      share the same frontier point. penalty_exponent 2.5 makes
      splitting strictly worse than consolidation.
    numinous: |
      MOSTLY DEFEATED: Winner-takes-all means copies split rank,
      not multiply rewards. But no formal dedup mechanism.
    gradients: |
      PARTIALLY DEFEATED: Stake-gated entry limits to 32 slots.
      But wealthy attackers can secure multiple slots with capital.

  weight_copying:
    attack: "Validator copies other validators' weight submissions"
    radar: |
      LOW RISK: Deterministic training means honest validators
      naturally agree. Copying is indistinguishable from honest
      independent computation. commit-reveal optional if needed.
    numinous: |
      LOW RISK: Deterministic execution + gateway gives natural
      validator agreement. Same analysis as RADAR.
    gradients: |
      MEDIUM RISK: Different validators may use different test sets.
      Weight agreement is less natural. commit-reveal more important.

  insider_collusion:
    attack: "Validator leaks evaluation data to own miners"
    radar: |
      DEFEATED: No evaluation data to leak. Ground truth is the
      training outcome itself. Validator would need to train the
      architecture AND leak it — but the miner already submitted it.
    numinous: |
      DEFEATED: Ground truth is external (event resolution from
      Polymarket/Azuro). Validators don't control outcomes.
    gradients: |
      VULNERABLE: Validators hold secret test sets. Leaking test
      data to own miners gives perfect evaluation scores.
      This attack is invisible and economically rational.

  lazy_validator:
    attack: "Validator skips computation, submits random/copied weights"
    radar: |
      DETECTABLE: Deterministic training means honest validators
      will strongly agree. Random weights are outliers, clipped
      by Yuma Consensus. Lazy validators lose stake influence.
    numinous: |
      DETECTABLE: Same mechanism — deterministic execution means
      lazy validators produce outlier weights, clipped by consensus.
    gradients: |
      HARDER TO DETECT: Different test sets may produce legitimately
      different rankings. Harder to distinguish lazy from honest-but-different.

  model_copy_with_noise:
    attack: "Copy best submission, add trivial noise to appear different"
    radar: |
      DEFEATED: Assigned parent mechanism means copied architecture
      IS the parent. Score = improvement over parent = ~0.
      Noise doesn't help because improvement is measured, not similarity.
    numinous: |
      PARTIALLY DEFEATED: Noisy copy produces similar Brier Score.
      Winner-takes-all means tie goes to original (or random).
      No positive incentive to copy.
    gradients: |
      PARTIALLY DEFEATED: Champion margin means noisy copy must
      beat original by 5-10%. Mere copying with noise fails.
      But leaked test set could enable targeted improvement.

  compute_resource_gaming:
    attack: "Use external compute resources beyond what's allowed"
    radar: |
      PREVENTED: Validator runs training on own infrastructure.
      Miner code executes in validator-controlled container.
      No external compute can assist during evaluation.
    numinous: |
      BOUNDED: Gateway proxy mediates all external calls.
      $0.02 cost cap per run limits API abuse.
      150s timeout limits compute time.
    gradients: |
      PREVENTED: Validator runs training code in isolated container.
      Same model as RADAR — validator infrastructure only.

# =============================================================================
# WHAT RADAR SHOULD LEARN FROM PEERS
# =============================================================================

lessons_to_adopt:
  from_numinous:
    gateway_proxy_pattern:
      what: "Signing proxy for controlled external API access"
      why: |
        If RADAR architectures need external resources during training
        (unlikely for NAS but possible for data-dependent architectures),
        Numinous's gateway pattern is the gold standard for controlled access.
      priority: "LOW - only relevant if external API access needed"

    update_rate_limiting:
      what: "3-day minimum between code updates"
      why: |
        Prevents rapid trial-and-error probing of the scoring system.
        RADAR's per-epoch submission model may allow too-frequent updates
        in early network stages. Consider minimum intervals.
      priority: "MEDIUM - worth considering for early network stability"

    proper_scoring_rule:
      what: "Brier Score guarantees honest prediction is optimal"
      why: |
        RADAR should verify its scoring function has this property.
        If gaming the scoring function is easier than doing honest work,
        the mechanism fails regardless of other protections.
      priority: "HIGH - verify RADAR's scoring is a proper scoring rule"

  from_gradients:
    tournament_engagement:
      what: "Knockout bracket structure creates excitement"
      why: |
        Evolutionary NAS could adopt tournament-style epochs where
        architectures compete in brackets, adding engagement layer
        on top of the Pareto scoring. This is a UX improvement, not
        a security improvement.
      priority: "LOW - engagement, not anti-gaming"

    champion_margin:
      what: "Defender must be beaten by significant margin"
      why: |
        RADAR could add minimum improvement thresholds for an
        architecture to displace its parent. This prevents trivial
        +epsilon improvements from dominating the frontier.
      priority: "MEDIUM - prevents gradient-hacking style epsilon attacks"

    open_source_archival:
      what: "Winning code published for community"
      why: |
        RADAR's winning architectures should be archived and published.
        Creates community learning + rising baseline. Already aligned
        with Chi's open_source_preference invariant.
      priority: "HIGH - already fits Chi's design philosophy"

# =============================================================================
# KNOWN GAPS AND OPEN QUESTIONS
# =============================================================================

open_questions:
  radar_specific:
    agent_meta_layer_gaming:
      question: |
        If miners submit "agents that design architectures," what prevents
        an agent from being optimized to game the scoring function rather
        than genuinely search for good architectures?
      proposed_mitigation: |
        The scoring function evaluates the ARCHITECTURES produced by the agent,
        not the agent itself. An agent that games scoring still needs to produce
        architectures that score well on the multi-axis Pareto frontier.
      risk_level: "MEDIUM"

    compute_cost_sustainability:
      question: |
        RADAR requires validators to TRAIN architectures. This is
        significantly more expensive than Numinous (inference only)
        or even Gradients (training but only 32 miners per week).
        How does this scale?
      proposed_mitigation: |
        4-stage funnel with ~80% elimination at Stage 1 helps.
        Also: architectures could be trained at smaller scale for
        evaluation, with scaling exponent predicting full-scale behavior.
      risk_level: "HIGH - compute cost is existential for validator participation"

    scaling_exponent_manipulation:
      question: |
        Could a miner design an architecture that artificially inflates
        its scaling exponent gamma by performing poorly at low FLOP counts
        and normally at high FLOP counts?
      proposed_mitigation: |
        Require minimum absolute performance at each checkpoint, not just
        slope. Add R-squared of the log-log fit as a quality filter.
        Reject architectures with poor fit (noisy/manipulated curves).
      risk_level: "MEDIUM - worth adding R-squared filtering"

  ecosystem_comparison:
    production_validation:
      question: "RADAR scores highest on paper but has zero mainnet hours. How confident are the theoretical advantages?"
      answer: |
        Every anti-gaming mechanism in RADAR has precedent:
        - Pareto scoring: proven on SN120 (Affine)
        - Container execution: proven on SN6, SN56, SN26, SN120
        - Code submission: proven on SN56 (Gradients)
        - Improvement-over-baseline: proven on SN3 (Templar gradient quality)
        The novelty is the COMBINATION, not individual components.
        Deploy on testnet with adversarial red-teaming before mainnet.

