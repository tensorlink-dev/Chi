# Example: RADAR (Reasoned Architecture Design & Automated Research)
# Miners submit agent software that designs neural architectures
# Pattern: container_execution with multi-scale training funnel

metadata:
  name: radar
  also_known_as: "RADAR (Reasoned Architecture Design & Automated Research)"
  repo: "https://github.com/TensorLink-AI/agentic-nas"
  developer: "TensorLink"
  category: architecture_search
  patterns_used:
    - container_execution  # miners run LLM agents in containers
  integrations:
    - basilica              # GPU pods for proxy eval + training
    - chutes                # LLM inference for agents
    - desearch              # Research context retrieval
    - hippius               # Decentralised storage for artifacts
  current_task: "time_series_foundation"

# ===========================================================================
# WHAT IS BEING MEASURED
# ===========================================================================

measurement:
  one_sentence: "Agent software quality for neural architecture design"
  commodity: software  # → container_execution pattern

  detail: |
    Miners submit LLM-backed agents that design neural architectures.
    Validators send a baseline as Challenge, agents design code to beat it.
    4-phase funnel: generation, proxy filter, multi-scale training, Pareto scoring.
    Agents do NOT have to derive from the baseline — novel designs welcome.

# ===========================================================================
# MECHANISM OVERVIEW
# ===========================================================================

mechanism:
  summary: |
    Validator selects baseline from DB → sends Challenge to miner agents →
    proxy filter → multi-scale training (3 short + 1 long) on trusted GPU →
    4-axis Pareto scoring → EMA → weight setting.

  flow:
    miner:
      1_develop: "Build LLM-backed architecture design agent"
      2_commit: "Commit Docker image to chain"
      3_receive_challenge: "Agent receives baseline code, constraints, context"
      4_design: "Agent designs architecture to beat baseline"
      5_submit: "Return source code + design motivation"

    validator:
      1_select_baseline: "Pick current best model from DB"
      2_dispatch: "Spin up miner containers via Basilica, send Challenge"
      3_proxy_eval: "Batch AZ-NAS proxy evaluation"
      4_short_train: "3 log-uniform sizes [100K,50M], fixed steps"
      5_long_train: "1 log-uniform size [50M,125M], fixed wall-clock"
      6_score: "4-axis Pareto, 3-bucket allocation, EMA, set weights"

# ===========================================================================
# TASK SYSTEM
# ===========================================================================

task_system:
  design: |
    "Thin Task, Fat Core" — core infrastructure is task-agnostic.
    New tasks replace only scoring axes 3 and 4 (~5 files).

  time_series_foundation:
    model_contract: "TimeSeriesFoundationModel"
    metrics: "MASE (primary), CRPS (secondary)"
    constraints:
      max_params: 125_000_000
      max_inference_latency_ms: 50

# ===========================================================================
# AGENT INTERFACE
# ===========================================================================

agent_interface:
  function_signature: |
    def handle_challenge(challenge: dict) -> dict:
        # Args: task_name, constraints, parent_code, parent_metrics,
        #       context (top-K history), scaffold_code, flop_budget
        # Returns: model_code (REQUIRED), motivation, name, config

  http_server:
    endpoint: "POST /challenge on port 8080"
    health: "GET /"

  code_constraints:
    model_class: "Must subclass task-specific base"
    factory: "Must define instantiate_model(config=None)"

# ===========================================================================
# SANDBOX EXECUTION
# ===========================================================================

sandbox:
  technology: docker_containers
  isolation: full

  miner_pod:
    provider: "Basilica"
    resources: "CPU-only (agents make LLM calls, not training)"
    timeout: "30 minutes"
    max_concurrent: 8
    note: "Validator runs the miner's container"

# ===========================================================================
# FILTERING (ZERO-COST PROXY SCREENING)
# ===========================================================================

filtering:
  method: "AZ-NAS inspired zero-cost proxies"
  proxies: [effective_rank, deep_collapse_ratio, saliency_per_param,
            sensitivity_log_norm, grad_coherence, state_velocity, local_contrast]
  ranking: "Borda count across all proxy dimensions"
  top_k: 16

# ===========================================================================
# TRAINING (MULTI-SCALE FUNNEL)
# ===========================================================================

training:
  overview: |
    Every candidate trains at 4 parameter scales sampled log-uniformly.
    Parent baseline trains at all four sizes under identical conditions.

  size_sampling:
    method: "Log-uniform (equal probability per order of magnitude)"
    short_train: "3 sizes from [100K, 50M], fixed steps"
    long_train: "1 size from [50M, 125M], fixed wall-clock (4 hours)"

  short_train:
    purpose: "Architectural comparison — measures α and Peak E"
    survivors: 19

  long_train:
    purpose: "Deployment value — measures Best CRPS and Best MASE"
    finalists: 3

  checkpoints: "[2%, 4%, 6%, 8%, 10%, 15%, 20%, 30%, 40%, 50%, 60%, 70%, 80%, 90%, 100%]"

  execution: "CUDA streams on single Basilica GPU pod"

# ===========================================================================
# SCORING
# ===========================================================================

scoring:
  metric: "4-axis margin-based Pareto"

  axes:
    peak_E: "Irreducible loss floor (lowest E across all sizes)"
    alpha: "Compute-scaling exponent (how loss scales across sizes)"
    best_crps: "Minimum CRPS across all sizes (task-specific)"
    best_mase: "Minimum MASE across all sizes (task-specific)"

  fitting:
    formula: "L(F) = E + C / F^γ  (F = cumulative FLOPs)"
    validation: "Power-law fit validated against exponential alternative"
    confidence: "Continuous: max(0, 1 - MSE_ratio)"

  pareto:
    margins: { peak_E: 0.02, alpha: 0.05, crps: 0.005, mase: 0.005 }
    rule: "Margin-based 4-axis pairwise dominance"

  reward_buckets:
    short_train: "5% — all candidates completing short training"
    below_parent: "20% — failed above-parent gate on all axes"
    above_parent: "75% — beat parent on at least 1 axis beyond margin"
    sub_pools: "Peak E 25%, α 25%, CRPS 15%, MASE 15%, Pareto 20%"

  ema:
    alpha: 0.1
    formula: "ema[uid] = alpha * epoch_score + (1 - alpha) * ema[uid]"

# ===========================================================================
# GROUND TRUTH SOURCE
# ===========================================================================

ground_truth:
  source: validation_loss
  note: "All checkpoints use validation loss — memorisation does not help"
  providers: [huggingface_datasets, cloudflare_r2]
  verification: "Train candidate at multiple sizes, measure on held-out data"

# ===========================================================================
# ANTI-GAMING PROPERTIES
# ===========================================================================

anti_gaming:
  agent_software:
    mechanism: "Agents run every epoch on trusted infra"
    benefit: "Rewards consistent capability, not one-off luck"

  multi_scale_training:
    mechanism: "4 sizes sampled log-uniformly each epoch"
    benefit: "Cannot optimise for specific size targets"

  fixed_step_scaling:
    mechanism: "Short-train uses fixed steps, not wall-clock"
    benefit: "Compute-efficient architectures don't gain extra data"

  peak_e_novelty:
    mechanism: "Same architecture family converges to same E"
    benefit: "Requires new inductive bias to improve"

  validation_loss:
    mechanism: "All fitting from held-out validation data"
    benefit: "Memorisation does not reduce E"

  margin_pareto:
    mechanism: "Margin-based Pareto comparison"
    benefit: "Absorbs inter-validator fitting variance"

  borda_proxies:
    mechanism: "Rank-sum across 7 proxy dimensions"
    benefit: "No single proxy gameable in isolation"

  parentless_epochs:
    mechanism: "15% of epochs skip baseline"
    benefit: "Tests raw agent capability from scratch"

  assigned_baselines:
    mechanism: "Validator picks baseline from top-K pool"
    benefit: "Agents can't choose easy targets"

# ===========================================================================
# INTEGRATIONS
# ===========================================================================

integrations:
  basilica:
    purpose: "GPU pods for agent execution, proxy eval, training"
    pods: { agents: "CPU-only", proxy: "Single GPU", training: "GPU + CUDA streams" }

  chutes:
    purpose: "LLM inference for validator-side agents"

  desearch:
    purpose: "Research paper context for agent reasoning"

  hippius:
    purpose: "Decentralised storage for model artifacts"

# ===========================================================================
# ON-CHAIN MECHANICS
# ===========================================================================

chain:
  miner_commitment:
    content: "Docker image reference + metadata"
    rate_limit: "1 per ~100 blocks"
  weight_setting:
    method: "subtensor.set_weights()"
    frequency: "Once per epoch (24 hours)"

# ===========================================================================
# VALIDATOR CONSENSUS
# ===========================================================================

consensus:
  mechanism: yuma_consensus

  process:
    1: "Each validator independently runs full epoch"
    2: "Validators compute per-UID scores from training results"
    3: "EMA smoothing applied"
    4: "Weight assignments submitted on-chain"
    5: "Yuma Consensus takes stake-weighted median"

# ===========================================================================
# COMPARISON TO OTHER PATTERNS
# ===========================================================================

pattern_comparison:
  vs_numinous:
    similarity: "Both use agent software + containers"
    difference: "RADAR: architecture design + training. Numinous: forecasting + Brier Score"

  vs_affine:
    similarity: "Both use Pareto scoring"
    difference: "RADAR: 4-axis scaling-aware. Affine: ε-Pareto over RL environments"

  vs_gradients:
    similarity: "Both evaluate code quality"
    difference: "RADAR: architecture design agents. Gradients: fine-tuning tournaments"

# ===========================================================================
# CONNECTIONS TO KNOWLEDGE BASE
# ===========================================================================

knowledge_connections:
  subnet.invariants.yaml:
    validator_only_development: "Miners build their own agents externally"
    open_source_preference: "Best models visible in DB as agent context"
    compute_distribution: "Validators run containers AND training"

  container_execution.yaml:
    pattern_match: "Validators run miner agent software"
    implementation: "Basilica containers + multi-scale training"
    deviation: "Agents beat the baseline, don't fork from it"

  incentive.primitives.yaml:
    commodity_type: "software (architecture design agents)"
    verification_method: "direct (train at multiple sizes, measure scaling)"
    scoring_formula: "4-axis Pareto → 3-bucket → EMA → softmax"
    anti_gaming: "Borda proxies, fixed-step scaling, margin-based Pareto"

  design_flow.yaml:
    commodity: software
    ground_truth: "Validation loss at multiple scales"
    pattern: container_execution

  basilica.containers.yaml:
    miner_pods: "Isolated agent containers"
    training_pods: "GPU training on validator's trusted image"

# ===========================================================================
# LESSONS LEARNED
# ===========================================================================

lessons:
  experiment_history_as_context:
    insight: |
      A database of past experiments gives agents institutional memory.
      Working baseline code serves as high-quality few-shot context.
    applies_to: "Any subnet where LLM agents benefit from prior work"

  multi_scale_screening:
    insight: |
      Proxy → short multi-size train → long single-size train
      reduces compute 10-100x while enabling scaling law extraction.
    applies_to: "Subnets with expensive evaluation"

  four_axis_pareto:
    insight: |
      Peak E and α (50% combined) reward architectural innovation.
      Neither improves from hyperparameter tweaking.
    applies_to: "Multi-objective subnets"

  margin_based_pareto:
    insight: |
      Fixed margins absorb inter-validator variance from
      CUDA non-determinism on fitted parameters.
    applies_to: "Subnets using fitted parameters in scoring"

  fixed_steps_vs_fixed_wallclock:
    insight: |
      Fixed steps for scaling measurement, fixed wall-clock for
      deployment evaluation. Cleanly separates two concerns.
    applies_to: "Subnets comparing architectures with different per-step costs"

  log_uniform_sampling:
    insight: |
      Random size targets each epoch prevent gaming.
      DB builds dense coverage over time for population-level analysis.
    applies_to: "Subnets accumulating measurements over many epochs"

# ===========================================================================
# QUICK REFERENCE
# ===========================================================================

quick_reference:
  measuring: "Neural architecture quality via Peak E, α, Best CRPS, Best MASE"
  pattern: "container_execution with multi-scale training funnel"
  miner_provides: "LLM-backed agent software that designs architectures"
  validator_does: "Runs agent containers, filters, trains at 4 sizes, scores via Pareto"
  ground_truth: "Validation loss at 4 log-uniform parameter scales"
  scoring: "4-axis Pareto → 3-bucket (5%/20%/75%) → EMA → softmax"
  novel_mechanism: "Scaling law axes (Peak E, α) as first-class Pareto dimensions"
  key_invariant: "Validators run agents AND train output on trusted infrastructure"
